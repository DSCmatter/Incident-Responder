# Runtime config. Every limit here is enforced in code; see docs/DESIGN.md section 10.
limits:
  max_llm_calls_per_run: 12
  max_react_steps: 6
  max_react_steps_fast_path: 3
  max_critic_rounds: 2
  run_timeout_seconds: 60

routing:
  runbook_score_threshold: 0.75

llm:
  mode: live # live | record | replay
  chain: [ollama, openrouter, gemini]
  daily_budget:
    gemini: 200
    openrouter: 45
    ollama: unlimited
  # Cost-equivalent per million tokens. Free tiers are listed at zero so every
  # optimisation row is comparable even when no invoice exists.
  pricing:
    gemini-2.5-flash: { input_per_mtok: 0.30, output_per_mtok: 2.50 }
    nvidia/nemotron-3-ultra-550b-a55b:free: { input_per_mtok: 0.0, output_per_mtok: 0.0 }
    nvidia/nemotron-3.5-super-vl:free: { input_per_mtok: 0.0, output_per_mtok: 0.0 }
    baidu/ernie-5.5-flash-preview:free: { input_per_mtok: 0.0, output_per_mtok: 0.0 }
    qwen2.5:7b-instruct: { input_per_mtok: 0.0, output_per_mtok: 0.0 }
  backends:
    gemini:
      dialect: gemini
      base_url: https://generativelanguage.googleapis.com/v1beta
      model: gemini-2.5-flash
      api_key_env: GEMINI_API_KEY
      timeout_seconds: 60
    openrouter:
      dialect: openai
      base_url: https://openrouter.ai/api/v1
      # Chosen by `make smoke` on 2026-11-21; see docs/RESULTS.md.
      model: nvidia/nemotron-3-ultra-550b-a55b:free
      fallback_models:
        - nvidia/nemotron-3.5-super-vl:free
        - baidu/ernie-5.5-flash-preview:free
      api_key_env: OPENROUTER_API_KEY
      timeout_seconds: 60
    ollama:
      dialect: openai
      base_url: http://localhost:11434/v1
      model: qwen2.5:7b-instruct
      api_key_env: null
      timeout_seconds: 120

rag:
  k: 5
  embedding: sentence-transformers/all-MiniLM-L6-v2 # local, CPU; downloaded once

# Capability switches; each off-row is an ablation in docs/RESULTS.md.
features:
  rag: true # false: no runbook index, and no search_runbooks tool for any agent
