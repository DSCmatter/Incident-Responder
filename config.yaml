# Runtime config. Every limit here is enforced in code; see docs/DESIGN.md section 10.
limits:
  max_llm_calls_per_run: 12
  max_react_steps: 6
  max_react_steps_fast_path: 3
  max_critic_rounds: 2
  run_timeout_seconds: 60

routing:
  runbook_score_threshold: 0.75

llm:
  mode: live # live | record | replay
  chain: [gemini, openrouter, ollama]
  daily_budget:
    gemini: 200
    openrouter: 45
    ollama: unlimited
  backends:
    gemini:
      dialect: gemini
      base_url: https://generativelanguage.googleapis.com/v1beta
      model: gemini-2.5-flash
      api_key_env: GEMINI_API_KEY
      timeout_seconds: 60
    openrouter:
      dialect: openai
      base_url: https://openrouter.ai/api/v1
      model: google/gemini-2.5-flash-preview:free
      fallback_models:
        - meta-llama/llama-3.3-70b-instruct:free
        - qwen/qwen3-30b-a3b:free
      api_key_env: OPENROUTER_API_KEY
      timeout_seconds: 60
    ollama:
      dialect: openai
      base_url: http://localhost:11434/v1
      model: qwen2.5:7b-instruct
      api_key_env: null
      timeout_seconds: 120

rag:
  k: 5
  embedding: local-sentence-transformers
