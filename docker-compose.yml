services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: incident-responder-postgres
    environment:
      POSTGRES_USER: responder
      POSTGRES_PASSWORD: responder
      POSTGRES_DB: responder
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U responder -d responder"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
