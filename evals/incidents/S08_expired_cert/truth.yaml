root_cause: cert_expiry
service: payments-gw
summary: payments-gw's serving certificate expired at 2026-11-20T00:00:00Z; from that second every client
  handshake fails, so no charge reaches the gateway.
acceptable_fixes:
- rotate_cert
must_find:
- file: logs/billing-api.jsonl
  pattern: certificate has expired
- file: logs/payments-gw.jsonl
  pattern: 'tls: bad certificate'
escalation_ok: false
