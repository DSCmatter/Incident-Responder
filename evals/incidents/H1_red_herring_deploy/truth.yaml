root_cause: disk_full
service: notify-svc
summary: The /var/spool/notify volume had been filling since before noon and reached 100% at 12:43; every
  enqueue then failed with no space left on device. Deploy dpl-5b19 at 12:41 only reworded an email subject
  and is unrelated.
acceptable_fixes:
- free_disk
must_find:
- file: logs/notify-svc.jsonl
  pattern: no space left on device
- file: logs/notify-svc.jsonl
  pattern: /var/spool/notify 80% used
- file: metrics/notify-svc.json
  pattern: '"disk_used_pct"'
escalation_ok: false
